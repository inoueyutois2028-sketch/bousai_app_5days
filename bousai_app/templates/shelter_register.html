{% extends "base.html" %}

{% block content %}
<h2>避難所登録</h2>
<p>新しい避難所情報を登録します。</p>

<!-- 成功・エラーメッセージ表示 -->
{% if success %}
  <div style="padding: 12px 16px; border: 2px solid #2e7d32; background: #e8f5e9; color: #1b5e20; border-radius: 8px; margin-bottom: 16px;">
    <strong>登録完了</strong><br>
    {{ message }}
  </div>
  <p><a href="/all_shelters">全施設一覧を見る</a></p>
{% endif %}

{% if error %}
  <div style="padding: 12px 16px; border: 2px solid #c62828; background: #ffebee; color: #b71c1c; border-radius: 8px; margin-bottom: 16px;">
    <strong>登録できませんでした</strong><br>
    {{ message }}
  </div>
{% endif %}

<form method="POST">
  <p>
    <label for="name">避難所名（必須）</label><br>
    <input type="text" id="name" name="name">
  </p>
  <p><button type="submit">登録</button></p>
</form>
{% endblock %}
