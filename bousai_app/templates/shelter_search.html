{% extends "base.html" %}

{% block content %}
<style>
  .search-layout {
    display: grid;
    grid-template-columns: minmax(360px, 1.08fr) minmax(300px, 0.92fr);
    gap: 24px;
    align-items: start;
    margin-top: 0;
  }

  .search-frame {
    border: 2px solid #777;
    background: #fff;
    width: calc(100% + 36px);
    min-height: 390px;
    margin: -6px -18px 0;
    padding: 18px 28px 22px;
  }

  .search-column {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 43px;
  }

  .label {
    font-size: 1.28rem;
    font-weight: 700;
    color: #111;
    min-width: 116px;
    line-height: 1.3;
  }

  .input-box {
    flex: 1;
    width: 168px;
    min-height: 31px;
    border: 2px solid #c7c7c7;
    background: #fafafa;
    padding: 4px 10px;
    font-size: 0.98rem;
    border-radius: 0;
    box-sizing: border-box;
  }

  .radio-group {
    display: flex;
    align-items: center;
    gap: 18px;
    border: 2px solid #c7c7c7;
    background: #fafafa;
    min-height: 31px;
    padding: 0 8px;
    width: 168px;
    font-size: 0.92rem;
  }

  .checkbox-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(170px, 1fr));
    gap: 9px 18px;
    margin-top: 0;
  }

  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 1rem;
    line-height: 1.4;
  }

  .checkbox-item input {
    width: 14px;
    height: 14px;
    accent-color: #1b1b1b;
  }

  .hazard-box {
    min-height: 72px;
    padding: 0 6px 2px;
  }

  .search-button-wrap {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }

  .search-button {
    border: 2px solid #bdbdbd;
    background: #dfe5ea;
    color: #1c1c1c;
    padding: 6px 28px;
    font-size: 1rem;
    font-weight: 400;
    cursor: pointer;
    min-width: 106px;
    border-radius: 0;
    line-height: 1.2;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
  }

  .map-panel {
    position: relative;
    width: 100%;
    height: 142px;
    background: #fafafa;
    border: 2px solid #c7c7c7;
    box-shadow: none;
    overflow: hidden;
    z-index: auto;
    margin-top: 0;
  }

  .map-panel .map-label {
    position: absolute;
    top: 8px;
    left: 10px;
    z-index: 20;
    background: rgba(255,255,255,0.9);
    padding: 2px 5px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #888;
    border-radius: 0;
  }

  #shelterSearchMap {
    width: 100%;
    height: 100%;
  }

  .search-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding: 0 2px;
  }

  .search-footer a {
    color: #087bc1;
    font-size: 1rem;
    text-decoration: underline;
  }

  .result-title {
    margin-top: 16px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #0d4b8f;
  }

  .result-list {
    margin-top: 12px;
    list-style: disc;
    padding-left: 24px;
  }

  @media (max-width: 800px) {
    .search-layout {
      grid-template-columns: 1fr;
    }

    .field-row {
      flex-direction: column;
      align-items: flex-start;
    }

    .label {
      min-width: auto;
    }
  }
</style>

<form method="get" action="/shelter_search_results">
  <div class="search-frame">
    <div class="search-layout">
      <div class="search-column">
      <div class="field-row">
        <div class="label">避難所名</div>
        <input class="input-box" type="text" name="name" value="{{ request.args.get('name', '') }}" placeholder="（自由入力）">
      </div>

      <div class="field-row">
        <div class="label" style="font-size: 1.32rem;">どこから探すか</div>
        <div class="radio-group">
          <label><input type="radio" name="location" value="現在地" {% if request.args.get('location') == '現在地' %}checked{% endif %}> 現在地</label>
          <label><input type="radio" name="location" value="自宅" {% if request.args.get('location') == '自宅' %}checked{% endif %}> 自宅</label>
        </div>
      </div>

      <div>
        <div class="label" style="margin-bottom: 12px;">避難所設備条件</div>
        <div class="checkbox-list">
          <label class="checkbox-item"><input type="checkbox" name="equipment" value="バリアフリー" {% if 'バリアフリー' in request.args.getlist('equipment') %}checked{% endif %}> バリアフリー</label>
          <label class="checkbox-item"><input type="checkbox" name="equipment" value="ペット対応" {% if 'ペット対応' in request.args.getlist('equipment') %}checked{% endif %}> ペット対応</label>
          <label class="checkbox-item"><input type="checkbox" name="equipment" value="多言語対応" {% if '多言語対応' in request.args.getlist('equipment') %}checked{% endif %}> 多言語対応</label>
          <label class="checkbox-item"><input type="checkbox" name="equipment" value="なし" {% if 'なし' in request.args.getlist('equipment') %}checked{% endif %}> なし</label>
          <label class="checkbox-item"><input type="checkbox" name="equipment" value="その他" {% if 'その他' in request.args.getlist('equipment') %}checked{% endif %}> その他</label>
        </div>
      </div>
    </div>

      <div class="search-column">
      <div class="label" style="font-size: 1.42rem; margin-top: 2px;">対応している災害</div>
      <div class="hazard-box">
        <div class="checkbox-list" style="grid-template-columns: repeat(2, minmax(120px, 1fr));">
          <label class="checkbox-item"><input type="checkbox" name="hazard" value="地震" {% if '地震' in request.args.getlist('hazard') %}checked{% endif %}> 地震</label>
          <label class="checkbox-item"><input type="checkbox" name="hazard" value="河川氾濫" {% if '河川氾濫' in request.args.getlist('hazard') %}checked{% endif %}> 河川氾濫</label>
          <label class="checkbox-item"><input type="checkbox" name="hazard" value="津波" {% if '津波' in request.args.getlist('hazard') %}checked{% endif %}> 津波</label>
          <label class="checkbox-item"><input type="checkbox" name="hazard" value="積雪災害" {% if '積雪災害' in request.args.getlist('hazard') %}checked{% endif %}> 積雪災害</label>
          <label class="checkbox-item"><input type="checkbox" name="hazard" value="土砂災害" {% if '土砂災害' in request.args.getlist('hazard') %}checked{% endif %}> 土砂災害</label>
          <label class="checkbox-item"><input type="checkbox" name="hazard" value="台風" {% if '台風' in request.args.getlist('hazard') %}checked{% endif %}> 台風</label>
        </div>
      </div>

      <div class="map-panel">
        <div class="map-label">避難所マップ</div>
        <div id="shelterSearchMap"></div>
      </div>

      </div>
    </div>
    <div class="search-footer">
      <a href="/all_shelters">避難所一覧表示</a>
      <button class="search-button" type="submit">検索</button>
    </div>
  </div>
</form>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const map = L.map('shelterSearchMap', { zoomControl: false }).setView([40.8244, 140.7400], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);
});
</script>
{% endblock %}
