{% extends "base.html" %}

{% block content %}
<div class="panel">
  <div class="panel-header">
    <span>📍</span>
    <span>避難所マップ</span>
  </div>
  <div id="shelterMap" style="height: 340px; width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #dfe7f1; background: #dfeef4;"></div>
</div>

<div class="panel">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:12px;">
    <div class="panel-header" style="margin:0;">
      <span>⚠️</span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <div class="status-box" style="margin:0; padding:8px 12px; font-size:0.9rem; background:#eafaf2; border-color: rgba(31,165,111,0.2);">
      <span>🔄</span>
      <span>10分おきに自動更新</span>
    </div>
  </div>

  <div id="weatherContent">
    <p>読み込み中...</p>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([40.8244, 140.7400], 10);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = '<p>気象情報の取得に失敗しました</p>';
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        if (data.warnings && data.warnings.length > 0) {
            const warningList = data.warnings.map(item =>
                `<li>${item.name}（${item.status}）</li>`
            ).join('');

            weatherContent.innerHTML = `
                <div class="status-box" style="justify-content:flex-start; background:#fff4f2; color:#b42318; border-color: rgba(180,35,24,0.2);">
                  <span>⚠️</span>
                  <span>以下の警報・注意報が発表されています</span>
                </div>
                <ul style="margin: 0 0 16px 20px; color:#3d4a5b; line-height:1.8;">
                  ${warningList}
                </ul>
                <div style="color:#3d4a5b; font-size:0.95rem; line-height:1.8;">
                  <div>📍 対象地域: ${data.area_name || '青森市'}</div>
                  <div>🕒 最終確認: ${data.last_fetch_time || '更新中...'}</div>
                  <div>📡 気象庁最終発表: ${data.report_time || '不明'}</div>
                </div>
            `;
            return;
        }

        weatherContent.innerHTML = `
            <div class="status-box" style="justify-content:flex-start;">
              <span>✓</span>
              <span>現在、警報・注意報は発表されていません</span>
            </div>
            <div style="color:#3d4a5b; font-size:0.95rem; line-height:1.8;">
              <div>📍 対象地域: ${data.area_name || '青森市'}</div>
              <div>🕒 最終確認: ${data.last_fetch_time || '更新中...'}</div>
              <div>📡 気象庁最終発表: ${data.report_time || '不明'}</div>
            </div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
