<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --navy: #0d4b8f;
      --navy-deep: #0a3d79;
      --bg: #eef1f4;
      --panel: #f8f9fb;
      --card: #ffffff;
      --text: #1d2a39;
      --muted: #5e6f86;
      --line: #d9e1ea;
      --green: #1fa56f;
      --green-bg: #eafaf2;
      --green-text: #197f57;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .topbar {
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: white;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.08);
    }

    .brand {
      font-weight: 700;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: white;
    }

    .menu-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      opacity: 0.92;
    }

    .page {
      max-width: 980px;
      margin: 24px auto 40px;
      padding: 0 18px;
    }

    .panel {
      background: rgba(255,255,255,0.6);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(17, 36, 62, 0.06);
      padding: 18px 20px 20px;
      margin-bottom: 26px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: #0d4b8f;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--navy);
    }

    .status-box {
      background: var(--green-bg);
      color: var(--green-text);
      border: 1px solid rgba(31,165,111,0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 10px 0 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .brand { font-size: 1.5rem; }
      .topbar { padding: 0 18px; }
      .page { padding: 0 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">防災アプリ</div>
    <div class="menu-btn">☰</div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
